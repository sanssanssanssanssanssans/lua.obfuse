name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint (optional)
        run: |
          echo "Run linter if configured"
      - name: Build bundle (smoke test)
        run: |
          python main.py --entry tests/main.lua --output tests/main.o.lua
          if [ ! -f tests/main.o.lua ]; then echo "output missing"; exit 1; fi
      - name: Show output size
        run: ls -lh tests/main.o.lua || true